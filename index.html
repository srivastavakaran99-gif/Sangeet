<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./utility.css" />
    <title>Sangeet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Flow+Circular&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Momo+Signature&family=Playwrite+NZ+Basic:wght@100..400&family=Playwrite+NZ+Guides&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="container flex bg-black">
      <!--LEFT SIDE-->
       <div class="left">
          <div class="close">
          <img   width="30" class="invert" src="close.svg" alt="">
          </div>
         <!--HOME & SEARCH SECTION-->
        <div class="home bg-grey rounded m-2 p-1">
          <!--LOGO-->
            <div class="logo sangeet-logo">
                <svg class="wave-icon" viewBox="0 0 64 24" aria-hidden="true">
                    <path
                        d="M2 12c6-8 14-8 20 0s14 8 20 0 14-8 20 0"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="3"
                        stroke-linecap="round"/>
                    </svg>
                <span class="brand-name">Sangeet</span>
            </div>



     
          <ul>
            <!--HOME,SEARCH-->
            <li>
              <img class="invert homebtn" src="home.svg" alt="Home Icon" />
              <span>home</span></li>
            <li>
              <img class="invert searchbtn" src="search.svg" alt="Search Icon" />
              <span>Search</span>
            </li>
          </ul>
        </div>
        <!--LIBRARY SECTION-->
        <div class="library bg-grey rounded m-2 p-1">
          <div class="heading">
            <img src="playlist.svg" class="invert" alt="Playlist Icon" />
            <h2>Sangeet Library</h2>
          </div>
          <div class="songlist">
            <ul id="library">
              <li>
                <!--=======++++++++++JAVA SCRIPT SONG LIST++++++++++++++=================-->
              </li>
            </ul>
          </div>

          <!--Footer SECTION-->
          <div class="footer">
            <div>
              <a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a>
            </div>
            <div>
              <a href="https://www.spotify.com/jp/privacy/"
                ><span>Privacy Center</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/legal/privacy-policy/"
                ><span>Privacy Policy</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/legal/cookies-policy/"
                ><span>Cookies</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"
                ><span>About Ads</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/accessibility/"
                ><span>Accessibility</span></a
              >
            </div>
          </div>
        </div>
      </div>
      <!--RIGHT SIDE-->
      <div class="right bg-grey rounded">
       
        <div class="header">
           
          
          <div class="nav">
            <img class="invert hamburger" src="hamburger.svg" alt="">
            <svg
              class="cross"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18"
                stroke="#ffffff"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <svg
            class="cross"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M9 18L14.2929 12.7071C14.6262 12.3738 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6262 11.6262 14.2929 11.2929L9 6"
                stroke="#ffffff"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div class="buttons user-area">
            <span id="username"></span>
             <button class="btn logout hidden" id="logoutBtn">Logout</button>
            <button class="btn login" id="signupBtn">Sign up</button>
            <button class="btn signup" id="loginBtn">Log In</button>
          </div>
        </div>
        <!--Right side,playlist,songscards-->
        <div class="spotifyPlaylist">
          <h1>Sangeet playlist</h1>
          <div class="cardContainer">
            <!--=================== Java Script================================ -->
          </div> 
          <!-------------- Playbar----------------- -->
          <div class="playbar">
              <div class="seekbar">
                   <div class="circle"></div>
              </div>
              <div class="bar">

              </div>
              <div class="songinfo"></div>
              <div class="songbtn">
                 <img class="prev-btn" src="previous.svg" alt="playbar image" />
                 <img class="playbtn" src="play1.svg" alt="playbar image" />
                 <img class="next-btn" src="nextsong.svg" alt="playbar image" />
              </div>
                <div class="volume">
                      <img class="volume-icon" src="volume.svg" alt="volume" />
                      <input type="range" class="volume-range" min="0" max="100" value="100">
                      <span class="volume-percent">100%</span>
                  </div>
                  
              <div class="songtime">
                <span class="current-time">00:00</span>
                <span class="total-time">00:00</span>
                 </div>
              </div>
             
         </div>
  </div>
  </div>
</div>
<div class="auth-modal hidden" id="authModal">
  <div class="auth-box">
    <h2 id="authTitle">Login</h2>
    
          <div class="close1">
          <img   width="30" class="invert" src="close.svg" alt="">
          </div>
       

    <input type="text" id="name" placeholder="Name (signup only)">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button id="submitAuth">Continue</button>
    <p class="error" id="authError"></p>
  </div>
</div>

<script src="./script.js"></script>
</body>
</html>
